name: Feature request
description: Propose an improvement that fits SealedCash's verified scope.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior and how it should remain non-custodial and fail-closed.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy and security considerations
      description: Identify metadata, wallet, proof, or integration implications.
    validations:
      required: true